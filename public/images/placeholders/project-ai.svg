<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Systems Placeholder</title>
  <desc id="desc">Stylized retrieval augmented generation architecture visual.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081a34"/>
      <stop offset="50%" stop-color="#0b2d5a"/>
      <stop offset="100%" stop-color="#1a4d85"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4a82" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#123158" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(540 300) rotate(90) scale(260)">
      <stop stop-color="#92d0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#92d0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#9accff" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <rect width="1280" height="720" fill="url(#pulse)"/>

  <g>
    <circle cx="540" cy="320" r="154" fill="#132e55" stroke="#7ebfff" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="540" cy="320" r="102" fill="#1a3f70" stroke="#a3d4ff" stroke-opacity="0.4"/>
    <circle cx="540" cy="320" r="34" fill="#98d4ff"/>
  </g>

  <g fill="none" stroke="#8cc8ff" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round">
