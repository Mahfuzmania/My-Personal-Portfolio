<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Machine Learning Placeholder</title>
  <desc id="desc">Stylized machine learning analytics board.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101d3a"/>
      <stop offset="52%" stop-color="#173862"/>
      <stop offset="100%" stop-color="#2e5f91"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#204879" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#143155" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8fc8ff" stroke-opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <rect x="92" y="104" width="514" height="462" rx="24" fill="url(#pane)" stroke="#7fbefb" stroke-opacity="0.42"/>
  <rect x="662" y="104" width="526" height="208" rx="24" fill="url(#pane)" stroke="#7fbefb" stroke-opacity="0.42"/>
  <rect x="662" y="358" width="526" height="208" rx="24" fill="url(#pane)" stroke="#7fbefb" stroke-opacity="0.42"/>

  <g fill="none" stroke="#95d0ff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8">
    <path d="M140 456L212 410L286 438L356 312L436 364L518 238"/>
    <circle cx="212" cy="410" r="5" fill="#95d0ff"/>
    <circle cx="286" cy="438" r="5" fill="#95d0ff"/>
    <circle cx="356" cy="312" r="5" fill="#95d0ff"/>
    <circle cx="436" cy="364" r="5" fill="#95d0ff"/>
    <circle cx="518" cy="238" r="5" fill="#95d0ff"/>
  </g>

  <g fill="#dff0ff" font-family="'Segoe UI', Tahoma, sans-serif" font-size="22" font-weight="600">
    <text x="126" y="170">Model Evaluation</text>
    <text x="694" y="164">Feature Engineering</text>
    <text x="694" y="418">Inference + Reporting</text>
  </g>

  <g fill="#9eceff" font-family="'Segoe UI', Tahoma, sans-serif" font-size="14" letter-spacing="0.35">
    <text x="126" y="198">ROC trends, validation curves, error tracking</text>
    <text x="694" y="194">Selection, encoding, scaling, pipeline checks</text>
    <text x="694" y="448">Risk scoring, confidence bands, result export</text>
  </g>

  <g fill="#7ec2ff" fill-opacity="0.45">
    <rect x="694" y="218" width="210" height="14" rx="7"/>
    <rect x="694" y="244" width="256" height="14" rx="7"/>
    <rect x="694" y="270" width="190" height="14" rx="7"/>
    <rect x="694" y="472" width="274" height="14" rx="7"/>
    <rect x="694" y="498" width="224" height="14" rx="7"/>
    <rect x="694" y="524" width="294" height="14" rx="7"/>
  </g>

  <rect x="88" y="590" width="608" height="52" rx="14" fill="#0b223e" fill-opacity="0.78" stroke="#78bbfa" stroke-opacity="0.38"/>
  <text x="116" y="624" fill="#eaf6ff" font-family="'Segoe UI', Tahoma, sans-serif" font-size="27" font-weight="700">Machine Learning &amp; Analytics</text>
</svg>
