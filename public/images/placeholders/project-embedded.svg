  </g>

  <rect x="118" y="590" width="420" height="52" rx="14" fill="#0a1f36" fill-opacity="0.8" stroke="#81c0ff" stroke-opacity="0.38"/>
  <text x="146" y="624" fill="#e8f5ff" font-family="'Segoe UI', Tahoma, sans-serif" font-size="27" font-weight="700">Embedded / Systems Work</text>
