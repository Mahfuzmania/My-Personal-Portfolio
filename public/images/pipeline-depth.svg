<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare Data Flow</title>
  <desc id="desc">Modern visual for healthcare data pipeline depth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1a32"/>
      <stop offset="50%" stop-color="#12345d"/>
      <stop offset="100%" stop-color="#205288"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#224d81" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#16355a" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#99ccff" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="28" fill="url(#grid)"/>

  <rect x="72" y="88" width="278" height="132" rx="18" fill="url(#pane)" stroke="#87c5ff" stroke-opacity="0.42"/>
  <rect x="72" y="264" width="278" height="132" rx="18" fill="url(#pane)" stroke="#87c5ff" stroke-opacity="0.42"/>
  <rect x="72" y="440" width="278" height="132" rx="18" fill="url(#pane)" stroke="#87c5ff" stroke-opacity="0.42"/>

  <rect x="420" y="176" width="360" height="308" rx="22" fill="url(#pane)" stroke="#89c7ff" stroke-opacity="0.44"/>
  <rect x="844" y="140" width="282" height="170" rx="18" fill="url(#pane)" stroke="#89c7ff" stroke-opacity="0.44"/>
  <rect x="844" y="350" width="282" height="170" rx="18" fill="url(#pane)" stroke="#89c7ff" stroke-opacity="0.44"/>

  <g fill="none" stroke="#96d1ff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.82">
    <path d="M350 154H420"/>
    <path d="M350 330H420"/>
    <path d="M350 506H420"/>
    <path d="M780 225H844"/>
    <path d="M780 435H844"/>
  </g>

  <g fill="#e3f3ff" font-family="'Segoe UI', Tahoma, sans-serif" font-size="24" font-weight="600">
    <text x="96" y="160">Oracle Export</text>
    <text x="96" y="336">Lab Sheets</text>
    <text x="96" y="512">ID + Date Alignment</text>

    <text x="454" y="254">Unified Clinical Dataset</text>
    <text x="878" y="224">Analytics</text>
    <text x="878" y="434">Research</text>
  </g>

  <g fill="#9fceff" font-family="'Segoe UI', Tahoma, sans-serif" font-size="14" letter-spacing="0.3">
    <text x="454" y="286">Quality rules, deduplication, metadata audit</text>
    <text x="878" y="252">Dashboards and cohort metrics</text>
    <text x="878" y="462">Study-ready export packages</text>
  </g>

  <rect x="420" y="536" width="332" height="48" rx="12" fill="#0b223d" fill-opacity="0.8" stroke="#84c3ff" stroke-opacity="0.38"/>
  <text x="448" y="567" fill="#ebf6ff" font-family="'Segoe UI', Tahoma, sans-serif" font-size="24" font-weight="700">70k+ patients | 1M+ lab records</text>
</svg>
